name: Minify Assets

permissions:
  contents: write
  
on:
  push:
    paths:
      - '**.js'
      - '!**.min.js'
      - 'style.css'
      - 'admin/style.css'
      - '!**.min.css'
      - 'css/playground.css'
      - '!css/playground.min.css'
      - 'css/donate.css'
      - '!css/donate.min.css'
      - 'css/lesson.css'
      - '!css/lesson.min.css'
      - 'css/test.css'
      - '!css/test.min.css'
jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install minifiers
        run: npm install -g terser clean-css-cli
      
      - name: Minify JavaScript
        run: |
          terser script.js -c -m -o "script.min.js" --source-map "url=script.min.js.map"
          terser admin/script.js -c -m -o "admin/script.min.js" --source-map
          terser js/test.js -c -m -o "js/test.min.js" --source-map "url=test.min.js.map"

      - name: Minify CSS
        run: |
          cleancss -o "style.min.css" "style.css"
          cleancss -o "admin/style.min.css" "admin/style.css"
          cleancss -o "css/donate.min.css" "css/donate.css"
          cleancss -o "css/lesson.min.css" "css/lesson.css"
          cleancss -o "css/playground.min.css" "css/playground.css"
          cleancss -o "css/test.min.css" "css/test.css"
      
      - name: Commit minified files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.min.js *.min.js.map *.min.css admin/*.min.js admin/*.min.js.map admin/*.min.css css/donate.min.css css/lesson.min.css css/playground.min.css css/test.min.css js/test.min.js js/test.min.js.map
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-minify assets [skip ci]"
          git push
